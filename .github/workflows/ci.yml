name: ci
on:
  push:
    branches: [main, v2]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./cmd/...
      - name: Committed eggs are up to date
        run: |
          go run ./cmd/evr-ptero egg export --format ptdl --image ghcr.io/marshmallow-mia/echovr-pterodactyl:edge -o /tmp/egg.json
          go run ./cmd/evr-ptero egg export --format plcn --image ghcr.io/marshmallow-mia/echovr-pterodactyl:edge -o /tmp/egg.yaml
          # exported_at and the generator version differ; compare the rest
          strip() { grep -vE 'exported_at|Generated by evr-ptero' "$1"; }
          diff <(strip egg/egg-echovr-nevr.json) <(strip /tmp/egg.json)
          diff <(strip egg/egg-echovr-nevr.yaml) <(strip /tmp/egg.yaml)
  image:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: image/Dockerfile
          push: true
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/echovr-server:edge
            VERSION=edge-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/echovr-pterodactyl:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
